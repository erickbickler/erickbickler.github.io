<div class="card-container" *ngIf="card">
  <div class="card" [class.flipped]="flipped" [class.no-animation]="skipAnimation" (click)="onCardClick()">
    <div class="front">
      <span class="article" *ngIf="card.article">{{ card.article }}</span>
      <span class="word" [ngClass]="wordSizeClass">{{ card.word }}</span>
    </div>
    <div class="back">
      <div class="english" [ngClass]="englishSizeClass">{{ card.english }}</div>
    </div>
  </div>
</div>
<div class="audio-controls" *ngIf="card">
  <button class="audio-btn" (click)="onPlayAudio($event)" title="Listen to pronunciation">🔊</button>
</div>
