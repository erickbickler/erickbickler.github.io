<div class="flashcards-page">
  <div class="page-header">
    <h1>Chinese Flashcards</h1>
    <p>Spaced repetition learning for HSK levels 1-3</p>
  </div>

  <div class="level-selector">
    <h3>Learning Levels</h3>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [(ngModel)]="enabledLevels[0]"
          (change)="onLevelChange()"
        />
        <span class="checkbox-text">HSK 1</span>
      </label>
      <label class="checkbox-label">
        <input
          type="checkbox"
          [(ngModel)]="enabledLevels[1]"
          (change)="onLevelChange()"
        />
        <span class="checkbox-text">HSK 2</span>
      </label>
      <label class="checkbox-label">
        <input
          type="checkbox"
          [(ngModel)]="enabledLevels[2]"
          (change)="onLevelChange()"
        />
        <span class="checkbox-text">HSK 3</span>
      </label>
    </div>
  </div>

  <div class="stats">
    <p>{{ deckStats }}</p>
  </div>

  <div *ngIf="loading" class="loading">
    Loading cards...
  </div>

  <div *ngIf="!loading && enabledLevels[0] === false && enabledLevels[1] === false && enabledLevels[2] === false" class="empty-state">
    <p>Please select at least one HSK level to begin.</p>
  </div>

  <div *ngIf="!loading && isComplete" class="complete-state">
    <h2>All caught up! 🎉</h2>
    <p>You've reviewed all your due cards. Come back later to continue learning.</p>
  </div>

  <div *ngIf="!loading && !isComplete && currentCard && (enabledLevels[0] || enabledLevels[1] || enabledLevels[2])" class="card-section">
    <app-flashcard
      [card]="currentCard"
      [flipped]="isFlipped"
      (flipCard)="onFlip()"
    ></app-flashcard>

    <app-rating-buttons
      *ngIf="isFlipped"
      (rate)="onRate($event)"
    ></app-rating-buttons>
  </div>
</div>
